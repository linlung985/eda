---
- name: Prometheus Alertmanager
  hosts: all
  sources:
  - name: alertmanager
    ansible.eda.alertmanager:
      host: 0.0.0.0
      port: 5000
  rules:
  - name: Configuration Changed
    condition:
      all:
        - event.alert.status == "firing"
        - event.alert.labels.alertname == "HighFilesystemUsage"
    action:
      run_job_template:
        name: Recover
        organization: Default
