---
- name: Check Web Application
  hosts: all
  sources:
  - name: url_check
    ansible.eda.url_check:
      urls:
        - http://192.168.196.121
#      delay: 10
  rules:
  - name: Restart service if webpage unreachable
    condition: event.url_check.status == "down"
    action:
      run_job_template:
        name: httpd_restart
        organization: Default
