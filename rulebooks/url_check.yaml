---
- name: Check Web Application
  hosts: all
  sources:
  - name: url_check
    ansible.eda.url_check:
      urls:
        - https://192.168.196.131
      delay: 10
  rules:
  - name: 如果回應不是200，則記錄事件
    condition: event.url_check.response_code != 200
    action:
      run_job_template:
        name: Recover
        organization: Default
